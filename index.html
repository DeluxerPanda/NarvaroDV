<!DOCTYPE html>
<html lang="sv-SE">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow,noarchive,nocache,nosnippet,noimageindex"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="./css/styles.css">
  <link rel="stylesheet" href="./css/loading.css" media="screen"/>
  <link rel="stylesheet" type="text/css" href="./css/print.css" media="print">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
  <noscript>
    <title>JavaScript måste vara aktiverat</title>
  </noscript>
</head>

<body>

  <div id="checkMonthChangeProgressBar" class="dont-print-that"></div>

  <header id="menuTopButtons" class="dont-print-that">

    <button class="MenuButtons" id="MenuButtonDialogEditTopBar" onclick="dialogEditTopBar()"><i class="material-icons"
        style="vertical-align:middle; font-size: 15px;">edit</i> Redigera deltagare</button>

    <button class="MenuButtons" id="MenuButtonDialogPrint" onclick="printMain()"><i class="material-icons"
        style="vertical-align:middle; font-size: 15px;">print</i> Skriv ut</button>

            <button class="MenuButtons" id="MenuButtonDialogSaveAsJson" onclick="getJson()"><i class="material-icons"
        style="vertical-align:middle; font-size: 15px;">save_as</i> Spara deltagare som fil</button>

    <button class="MenuButtons" id="MenuButtonSwichDate" onclick="dialogSwichDate()"><i class="material-icons"
        style="vertical-align:middle; font-size: 15px;">calendar_month</i> Byt månad</button>

    <button class="MenuButtons" id="MenuButtonFullScreen" onclick="fullScreen()"><i class="material-icons"
        style="vertical-align:middle; font-size: 15px;">fullscreen</i> Fullskärmsläge</button>

  </header>

  <main id="layoutMain">

    <button id="MenuButtonExitFullScreen" onclick="fullScreen()"><i class="material-icons"
        style="vertical-align:middle; font-size: 15px;">fullscreen_exit</i> Stäng av fullskärmsläge</button>
    <div class="title-container">
      <div class="title title-child">
        <a id="titelDataTitel"></a>
        <br>
        <a id="titleDate"></a>
      </div>

      <div class="info-Box title-child">
        <div class="info-Heldag-Box">
          <a class="info-Text">Heldag</a>
        </div>
        <div class="info-Halvdag-Box">
          <a class="info-Text">Halvdag</a>
        </div>
      </div>
    </div>


    <div class="column">

      <div class="numerCenter" id="numer"></div>

      <div id="column"></div>
      <noscript class="viktigtMedelande">
        <h1>Tyvärr, din webbläsare måste ha JavaScript igång!</h1>
        <h2>JavaScript måste vara aktiverat för att denna applikation ska fungera korrekt.</h2>
      </noscript>
      <div id="NotSupportedBrowser" class="viktigtMedelande" style="display: none;">
        <h1>Tyvärr, din webbläsare stöds inte!</h1>
        <h2> Använd eller som är baserad på: <a href="https://www.google.com/chrome/" target="_blank">Google Chrome</a> eller <a href="https://www.microsoft.com/edge" target="_blank">Microsoft Edge</a></h2>
        <button class="MenuButtons" id="useUnSupportedBrowserButton" onclick="useUnSupportedBrowser()" >Använd denna webbläsare ändå</button>
      </div>

    </div>
  </main>

  <dialog id="dialog" closedby="none">
    <h1 id="dialogName"></h1>

    <div class="dialogTop">
      <button class="dialogButton_X" id="dialogX">
        Här
        <br>
        [X]
      </button>

      <button class="dialogButton_M" id="dialogM">
        Äta
        <br>
        [M]
      </button>

      <button class="dialogButton_L" id="dialogL">
        Ledigt/
        <br>
        Semester
        <br>
        [L]
      </button>
    </div>
    <br>

    <button class="dialogButton_-" id="dialog-">
      Inte här
      <br>
      [-]
    </button>

    <button class="dialogButton_S" id="dialogS">
      Sjuk
      <br>
      [S]
    </button>

    <button id="dialogRensa">Sudda</button>
    <button class="dialogclose" id="dialogclose">Stäng</button>
  </dialog>


  <dialog id="dialogSwichDate" closedby="none">
    <h1 class="dialogName">Byt månad</h1>
    <h1 class="dialogName" id="dialogNameYear"></h1>
    <span class="loader" id="dialogSwichDateLoader"></span>
    <div id="dialogSwichDateButtons">
     <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_januari">Januari</button>
     <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_februari">Februari</button>
     <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_mars">Mars</button>
      <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_april">April</button>
      <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_maj">Maj</button>
      <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_juni">Juni</button>
      <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_juli">Juli</button>
      <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_augusti">Augusti</button>
      <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_september">September</button>
      <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_oktober">Oktober</button>
      <button class="dialogButtonSwichDate" id="dialogSwichDateMonad_november">November</button>
      </div>
    <button class="dialogSwichDateclose" id="dialogSwichDateclose"onclick="closeDialog('dialogSwichDate')">Stäng</button>
  </dialog>

  <!-- Edit page -->
  <div id="layoutEdit">

    <h1 class="menuTitelEditDialog">Redigera</h1>

    <h2 class="menuTitelEditDialog" id="menuTitelEditDialog">Grupp namn</h2>

    <div id="gruppEditContainer"></div>

    <br>
    <div class="AddNames" id="AddNames">
      <button class="dialogAddName" id="MenuButtonEditDialogAdd" onclick="createName()">Lägg till deltagare</button>
      <br><a style="font-size: large; font-weight: 900;" id="ladda_deltagare_eller">eller</a><br>
      <input type="file" class="file" id="real-file" hidden="hidden">
      <button type="button" class="dialogAddName" id="MenuButtonEditDialogAddByFile">Ladda
        deltagare ifrån fil</button>
    </div>

    <h2 class="menuTitelEditDialog" id="menuSubTitelEditDialog">Deltagare</h2>

    <div id="createNameBox" style="display:none;">

      <form id="createNameForm" action="javascript:;" onsubmit="addNameInArray()">
        <label for="newNameInput"> Deltagarens namn:</label>
        <input type="text" id="newNameInput" placeholder="Deltagarens namn" style="text-transform: uppercase"
          minlength="1" maxlength="10" required>
        <input type="submit" id="createNameSubmit" value="Lägg till deltagare">
      </form>

    </div>

    <div id="AddNamesBox">
      <div id="nameEditContainer"></div>
    </div>
  </div>

  <!-- Loading bar -->
  <dialog id="LoadingBarDialog" closedby="none" inert>
    <span class="loader"></span>
  </dialog>


</body>
<script src="./js/main.js"></script>
<script src="./js/EditTab.js"></script>
<script src="./js/indexedDB.js"></script>
<script src="./js/print.js"></script>
<script src="./js/fullscreen.js"></script>

</html>
